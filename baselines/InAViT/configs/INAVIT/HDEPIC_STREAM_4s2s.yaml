# HD-EPIC P01 streaming: 4s observation, predict the action +2s ahead.
# 16 frames spanning 4s (same token budget as official EK InAViT 16x4).
HOIVIT:
  ENABLE: True
  O: 4
  U: 1
  LAYERS: [1, 6, 10]
  USE_MOTION_STREAM: True
  MOTION_STREAM_ATTN_TYPE: joint
  DOUBLEATTENTION: False
  MASK_FG: False
EPICKITCHENS:
  ANTICIPATION: True
TRAIN:
  ENABLE: True
  DATASET: epickitchens
  BATCH_SIZE: 8
  EVAL_PERIOD: 1
  CHECKPOINT_PERIOD: 1
  AUTO_RESUME: True
  MIXED_PRECISION: True
DATA:
  NUM_FRAMES: 16
  SAMPLING_RATE: 8
  OBS_SEC: 4.0
  ANTICIPATION_SEC: 2.0
  TARGET_FPS: 30
  TRAIN_JITTER_SCALES: [256, 320]
  TRAIN_CROP_SIZE: 224
  TEST_CROP_SIZE: 224
  INPUT_CHANNEL_NUM: [3]
  MEAN: [0.5, 0.5, 0.5]
  STD: [0.5, 0.5, 0.5]
AUG:
  ENABLE: False
SOLVER:
  HOIVIT_BASE_LR: 1e-4
  BASE_LR: 1e-5
  LR_POLICY: cosine
  MAX_EPOCH: 20
  WEIGHT_DECAY: 5e-2
  OPTIMIZING_METHOD: adamw
MF:
  PATCH_SIZE: 16
  PATCH_SIZE_TEMP: 2
  CHANNELS: 3
  EMBED_DIM: 768
  DEPTH: 12
  NUM_HEADS: 12
  MLP_RATIO: 4
  QKV_BIAS: True
  VIDEO_INPUT: True
  TEMPORAL_RESOLUTION: 8
  USE_MLP: True
  DROP: 0.0
  POS_DROPOUT: 0.0
  DROP_PATH: 0.2
  IM_PRETRAINED: False
  HEAD_DROPOUT: 0.0
  HEAD_ACT: tanh
  ATTN_LAYER: trajectory
MODEL:
  NUM_CLASSES: 97
  ARCH: slow
  MODEL_NAME: Motionformer
  LOSS_FUNC: cross_entropy
TEST:
  ENABLE: False
  DATASET: epickitchens
  BATCH_SIZE: 8
  NUM_ENSEMBLE_VIEWS: 1
  NUM_SPATIAL_CROPS: 1
DATA_LOADER:
  NUM_WORKERS: 4
  PIN_MEMORY: True
NUM_GPUS: 1
NUM_SHARDS: 1
RNG_SEED: 0
OUTPUT_DIR: /scratch/ll5914/experiments/inavit_hdepic_p01_stream_4s2s
TENSORBOARD:
  ENABLE: False

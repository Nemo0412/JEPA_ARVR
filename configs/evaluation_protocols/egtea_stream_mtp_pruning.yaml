      heldout_manifest_csv: 937f1e140fc0eeb3942804cebdece5ecef43e39202d92be18f3a5d59fcdc9d42
      e0_row_keys: 022f378f1a2104faad7974d48c745f41bb6175202445bbace5901400ff1369ee
      vjepa_vitl_checkpoint: 5346856ec9df69487fe72a25bf2632aaa8112df33fb67708e3f7374edc1f7012
      stream_mtp_parent_best: 7b12fdd545c4330198a3a149e02c40566735d86c427e7631acdaa1ea57c02949
      encoder_lora_best: dd60d54737db584bd0897922784c0e2909a7c98e90ed05bbaa55b3ccb4c3a4eb
      predictor_lora_best: 1e70d73a311dd290df4e6137e4b0adfcc6dc8fbdd63b0d905463e59a1705895c
    population:
      manifest_slice: [128, 256]
      expected_rows: 128
      expected_video_clusters: 22
      selection_boundary: frozen before any E0 task outcome; never used for final validation selection
    completion_contract:
      prune_layer: 16
      group: one tubelet slot by 8x8 patches
      tokens_per_group: 64
      reference_budget: 4096
      retained_budget: 3072
      bridge_tokens: 1024
      reference: exact top-64 group-attention set
      retained: exact top-48 prefix set of the same stable attention ranking
      teacher_target: bridge-position block-23 latents from the K4096 reference route
      recovery_interface: separate frozen predictor pass at original positions followed by the unchanged rebased future-prediction task path
      predictor_lora_during_recovery: disabled
      predictor_lora_during_future_prediction: enabled
      teacher_stage_arms: [reference_k4096, retained_k3072, teacher_completion, mask_only_completion, zero_completion, mean_completion, same_slot_pool_completion]
      jepa_stage_arms: [reference_k4096, retained_k3072, jepa_completion]
    teacher_gate:
      primary_metric: paired weighted verb+noun+action CE over horizons 2/4/6s with weights 1.0/0.7/0.5
      bootstrap_unit: video_id
      bootstrap_samples: 20000
      bootstrap_seed: 170317
      min_relative_task_loss_reduction: 0.005
      improvement_cluster_ci_lower_gt: 0.0
      min_improved_row_fraction: 0.50
      failure_decision: close E0 without running frozen JEPA completion
    jepa_and_cost_gate:
      min_teacher_gap_recovery_fraction: 0.25
      improvement_cluster_ci_lower_gt: 0.0
      jepa_minus_each_placebo_cluster_ci_lower_gt: 0.0
      post_l16_dense_mac_reduction_gt: 0.0
      min_model_e2e_latency_reduction: 0.05
      latency_population: first 4 frozen E0 rows
      latency_repeats_per_row_arm: 5
      overall_rule: representation and efficiency gates must both pass
    required_gates:
      - exact heldout-manifest rows 128 through 255 and all 22 video clusters
      - no E0 row is used for final validation selection
      - L16 native no-delete parity max_abs is at most 1e-5
      - untouched K4096 reference split-and-merge parity is bit exact
      - K3072 is the nested top-48 prefix set of the same stable ranking as K4096
      - retained and bridge positions are disjoint and preserve exact original positions
      - task-interface counts are exactly 4096 reference/completed 3072 retained and 1024 bridge
      - teacher bridge latents come only from the K4096 block-23 reference route
      - JEPA recovery accepts retained values plus target positions but no target values
      - task predictor-LoRA is disabled during mask-only/JEPA recovery and restored for future prediction
      - teacher and all four placebo arms run and audit before JEPA scientific authorization
      - smoke outcomes cannot alter arms population metrics or thresholds
      - paired confidence intervals resample video/session clusters
      - dense MAC scope and model-only end-to-end CUDA-event latency scope remain separately labeled
      - no validation learned codec L8 or history-scaling run is authorized by E0

      predictor_lora_best: 1e70d73a311dd290df4e6137e4b0adfcc6dc8fbdd63b0d905463e59a1705895c
    population:
      manifest_slice: [0, 128]
      expected_rows: 128
      expected_video_clusters: 22
    swap_contract:
      prune_layer: 16
      group: one tubelet slot by 8x8 patches
      tokens_per_group: 64
      budgets: [4096, 3072]
      candidates_per_source: 8
      sources: [jepa_disagreement, anti_jepa, attention_boundary]
      no_op_allowed: true
      singleton_task_deletion_target: forbidden
    decision_gate:
      bootstrap_unit: video_id
      bootstrap_samples: 20000
      bootstrap_seed: 170217
      min_relative_task_loss_reduction: 0.005
      min_improved_row_fraction: 0.50
      jepa_improvement_cluster_ci_lower_gt: 0.0
      jepa_minus_each_control_cluster_ci_lower_gt: 0.0
      overall_rule: at least one K passes all criteria and both K have positive point direction over both controls
    required_gates:
      - exact leading 128 rows of the untouched 2048-row held-out-train manifest
      - all 22 held-out video clusters occur in the scientific population
      - L16 native no-delete parity max_abs is at most 1e-5
      - coarse groups are exactly one slot by 8x8 patches
      - attention baseline contains exactly 64 groups at K4096 and 48 at K3072
      - attention baseline receives no recent-core task-protection or JEPA modification
      - JEPA target groups and latents cannot leak into predictor context
      - task predictor-LoRA is disabled only for JEPA reconstruction residual
      - singleton task-deletion loss is never computed
      - every candidate is one kept-group removal plus one dropped-group addition
      - each candidate source emits exactly eight stable rank-paired swaps
      - every evaluated set preserves exact K and original post-L16 encoder positions
      - true weighted multi-horizon task loss is measured only after complete swaps
      - smoke can alter runtime strategy only and cannot enter the scientific audit
      - no scorer training validation evaluation or co-adaptation is authorized by this protocol

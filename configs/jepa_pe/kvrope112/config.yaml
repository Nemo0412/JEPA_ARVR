nodes: 1
tasks_per_node: 1
cpus_per_task: 8
tag: clip-stream-kv-rope-c112-h2s-vitl16-256-8ep
eval_name: app.hdepic_lora_action_anticipation
folder: /scratch/ll5914/experiments/clip_stream_kv_rope_c112_h2s
resume_checkpoint: false
experiment:
  classifier:
    num_probe_blocks: 4
    num_heads: 16
  data:
    anticipation_time_sec:
    - 2.0
    - 2.0
    auto_augment: true
    file_format: 1
    dataset: EK100
    base_path: /scratch/ll5914/datasets/HD-EPIC/hdepic_vjepa_videos
    dataset_train: /scratch/ll5914/datasets/HD-EPIC/hdepic_vjepa_annotations/clip_split/HD_EPIC_train_vjepa.csv
    dataset_val: /scratch/ll5914/datasets/HD-EPIC/hdepic_vjepa_annotations/clip_split/HD_EPIC_val_vjepa.csv
    frames_per_clip: 128
    frames_per_second: 8
    motion_shift: false
    num_workers: 2
    pin_memory: false
    random_resize_scale:
    - 0.08
    - 1.0
    reprob: 0.25
    resolution: 256
    train_anticipation_point:
    - 0.0
    - 0.25
    train_anticipation_time_sec:
    - 2.0
    - 2.0
    val_num_workers: 1
    clip_balanced: true
    prefetch_factor: 1
    persistent_workers: true
  optimization:
    num_epochs: 8
    batch_size: 2
    use_bfloat16: true
    use_focal_loss: false
    multihead_kwargs:
    - weight_decay: 0.0001
      final_weight_decay: 0.0001
      lr: 2.0e-05
      start_lr: 0.0
      final_lr: 0.0
      warmup: 1
    val_every_epochs: 1
    best_metric: val-action-top5
    early_stopping_patience: 3
    grad_clip: 1.0
  lora:
    enabled: true
    rank: 8
    alpha: 16.0
    dropout: 0.05
    probe_train_mode: full
    train_heads: true
    freeze_pooler: false
    pretrained_probe: /scratch/ll5914/experiments/clip_stream_kv_matched_c112_h2s/action_anticipation_frozen/clip-stream-kv-c112-h2s-vitl16-256-8ep/latest.pt
    load_probe_heads: true
    align_reference_metrics: true
    val_metric_scope: native
    val_metric_aggregation: metric_wise_max
    class_space: train_only
    temporal_sampling: phd_reference
    output_regularization:
      enabled: false
    hdepic_reference:
      annotations_pkl: /scratch/ll5914/datasets/HD-EPIC/hd-epic-annotations/narrations-and-action-segments/HD_EPIC_Narrations.pkl
      verb_classes_csv: /scratch/ll5914/datasets/HD-EPIC/hd-epic-annotations/narrations-and-action-segments/HD_EPIC_verb_classes.csv
      noun_classes_csv: /scratch/ll5914/datasets/HD-EPIC/hd-epic-annotations/narrations-and-action-segments/HD_EPIC_noun_classes.csv
    gaze:
      mode: none
    stream_kv:
      enabled: true
      cache_frames: 112
      chunk_frames: 16
      train_last_chunk_only: true
    probe_temporal_rope:
      enabled: true
      rope_cross_attn_k: true
      grid_size: 16
      tubelet_size: 2
    encoder_lora:
      enabled: true
      rank: 8
      alpha: 16.0
      dropout: 0.05
      last_n_blocks: 0
      lr_mult: 0.5
      weight_decay: 0.0001
      activation_checkpointing: false
      target_suffixes:
      - attn.qkv
      - attn.proj
      warm_start_at_init: true
      freeze: false
      load_checkpoint_path: /scratch/ll5914/experiments/clip_stream_kv_matched_c112_h2s/action_anticipation_frozen/clip-stream-kv-c112-h2s-vitl16-256-8ep/encoder_lora_latest.pt
      checkpoint_path: /scratch/ll5914/experiments/clip_stream_kv_rope_c112_h2s/action_anticipation_frozen/clip-stream-kv-rope-c112-h2s-vitl16-256-8ep/encoder_lora_latest.pt
    predictor_lora:
      enabled: false
model_kwargs:
  checkpoint: /scratch/ll5914/models/vjepa2/vitl.pt
  module_name: evals.action_anticipation_frozen.modelcustom.vit_encoder_predictor_concat_ar
  wrapper_kwargs:
    no_predictor: true
    num_output_frames: 2
    num_steps: 1
  pretrain_kwargs:
    encoder:
      model_name: vit_large
      checkpoint_key: target_encoder
      tubelet_size: 2
      patch_size: 16
      uniform_power: true
      use_rope: true
    predictor:
      model_name: vit_predictor
      checkpoint_key: predictor
      num_frames: 64
      depth: 12
      num_heads: 12
      predictor_embed_dim: 384
      num_mask_tokens: 10
      uniform_power: true
      use_mask_tokens: true
      use_sdpa: true
      use_silu: false
      wide_silu: false
      use_rope: true
val_only: false
